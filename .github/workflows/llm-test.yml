name: brain-dryrun

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "News window (minutes)"
        default: "180"

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Start Ollama
        run: bash ci/ollama.sh
      - name: Dry run
        run: python tools/dryrun.py ${{ inputs.minutes }}
