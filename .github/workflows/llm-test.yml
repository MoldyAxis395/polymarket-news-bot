name: brain-dryrun

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "News window (minutes), or 'replay' for past trade headlines"
        default: "180"

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Dry run
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          [ -n "$GROQ_API_KEY" ] && echo "groq key length ${#GROQ_API_KEY}" || echo "groq key EMPTY"
          python tools/dryrun.py ${{ inputs.minutes }}
          cat data/llm_usage.json
